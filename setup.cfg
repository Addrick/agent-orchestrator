[pydeps]
cluster = True
max_module_depth = 2
no_show = True
output = docs/architecture.svg
format = svg
only =
    src.engine
    src.chat_system
    src.message_handler
    src.persona
    src.tools
    src.memory
    src.clients
    src.interfaces
    src.main

[importlinter]
root_packages =
    src
    config
include_external_packages = False
# Contracts describe runtime coupling. A TYPE_CHECKING-only import costs
# nothing at runtime and cannot create an import cycle, so it is not a layer
# violation. Without this, ~47 of the graph's edges are annotation-only noise
# that drowns the real violations (DP-302).
exclude_type_checking_imports = True

# Top of the list = highest layer. A layer may import anything below it and
# nothing above it. Siblings on one line (a : b) may not import each other.
#
# This order is derived from the actual runtime import graph, not from
# aspiration -- see memory/project/tasks/DP-302.md for how it was generated.
# The three `ignore_imports` entries below are the real, known violations; each
# is upward-pointing debt, not a design decision. Do not add to that list to
# make a new import pass -- fix the direction instead.
[importlinter:contract:architecture-layers]
name = Application layer boundaries
type = layers
layers =
    src.main : src.bootstrap
    src.interfaces
    src.agents
    src.voice : src.proxmox : src.self_edit
    src.chat_system
    src.turn_persistence
    src.message_handler
    src.request_builder
    src.confirmations
    src.personas
    src.tools
    src.proposals
    src.engine
    src.clients
    src.memory
    src.persona_fields
    src.persona
    src.security
    src.stream_engine
    src.utils
    src.app_manager : src.embedding_service : src.generation_events : src.generation_params : src.llm_errors : src.origin : src.text_tool_protocol : src.tool_policy
    config
ignore_imports =
    # DP-302 debt: two import cycles and one leaf violation. Each entry is a
    # single upward import; removing it removes the cycle.
    #
    # clients <-> tools: ZammadService reaches up to build its own tool handler
    # instead of the composition root registering it.
    src.clients.zammad_service -> src.tools.tool_manager
    # proposals <-> tools: AgentCallRunner takes a ToolManager at runtime.
    src.proposals.agent_call -> src.tools.tool_manager
    # utils -> personas -> tools -> ... -> utils: a 4-hop cycle that makes
    # `utils` non-leaf. model_utils only needs persona *data*, not the store.
    src.utils.model_utils -> src.personas.store

[importlinter:contract:utils-is-a-leaf]
name = utils must stay a dependency-free leaf
type = forbidden
source_modules =
    src.utils
forbidden_modules =
    src.personas
    src.tools
    src.persona
    src.memory
    src.engine
# DP-302: same violation as above, recorded twice on purpose -- this contract is
# the one to un-ignore first, because `utils` being a leaf is what breaks the
# 4-hop cycle.
ignore_imports =
    src.utils.model_utils -> src.personas.store

[importlinter:contract:interface-independence]
name = Bot interfaces must not import each other
type = independence
modules =
    src.interfaces.discord_bot
    src.interfaces.gmail_bot
