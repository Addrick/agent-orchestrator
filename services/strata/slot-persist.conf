# /etc/systemd/system/strata.service.d/slot-persist.conf on CT102 (DP-405B).
# Save the live conversation on every stop, restore it after every start.
[Unit]
Wants=strata-restore.service

[Service]
# Runs while the server is still up; the script never fails and gives up after its own timeout.
ExecStop=/opt/strata/strata-slot-persist save
# The save's 40 s cap plus the 60 s the unit already allowed for SIGTERM.
TimeoutStopSec=100
