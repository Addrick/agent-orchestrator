# tinyproxy for the stagr egress container (DP-456). Installed at
# /etc/tinyproxy/tinyproxy.conf in CT110. Only the setup VM may connect, and
# only to domains in the filter file, which egress-ctl writes.
User tinyproxy
Group tinyproxy
Port 8888
Listen 10.0.0.77
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
# Connect logs every request, so refused domains are visible.
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
Allow 10.0.0.76
DisableViaHeader Yes

# Default deny: a host not matched by a filter line is refused, for plain HTTP
# and for HTTPS CONNECT alike.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# HTTPS tunnels only to 443. Plain HTTP is not a CONNECT and is filtered by host.
ConnectPort 443
