# tinyproxy@codr: the WAN of codr-vm (10.0.0.75) (DP-465). Installed at
# /etc/egress/codr.conf in CT110. Started and stopped by `egress-ctl codr on|off`;
# the filter is written by `egress-ctl codr filter` before each start.
User tinyproxy
Group tinyproxy
Port 8889
Listen 10.0.0.77
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
LogFile "/var/log/tinyproxy/codr.log"
LogLevel Connect
MaxClients 50
Allow 10.0.0.75
DisableViaHeader Yes
Filter "/run/egress/codr.filter"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
# HTTPS only. git over ssh, other TLS ports, UDP and anything that ignores the
# proxy env do not get through (decision: sandbox-net-switch-mechanics).
ConnectPort 443
