# The R9700's inference CTs, behind inference-router (127.0.0.1:5006 on CT100, DP-483).
#
# Single R9700 => one inference CT runs at a time. CT102 is `backup` so routing is
# deterministic: .72 wins whenever it is up. Swapping CTs needs no config change:
# stop one, start the other, traffic follows. Which unit or preset each CT serves
# changes with every swap; ask the CT.

events {
    worker_connections 256;
}

http {
    upstream r9700_pool {
        server 10.0.0.72:5001 max_fails=2 fail_timeout=60s;         # CT101 Vulkan, koboldcpp units
        server 10.0.0.73:5001 max_fails=2 fail_timeout=60s backup;  # CT102 ROCm, Strata
    }

    # Long timeouts: gens regularly run 5-10 minutes for big prompts.
    proxy_connect_timeout  2s;    # keep short: a STOPPED CT's IP does not refuse, it silently drops (ARP fails), so a long connect timeout would hang every request instead of failing over.
    proxy_read_timeout     1200s;
    proxy_send_timeout     1200s;
    send_timeout           1200s;
    client_body_timeout    1200s;
    client_max_body_size   64m;

    server {
        listen 5001;

        location / {
            proxy_pass http://r9700_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;  # stream tokens through promptly

            # Fail over to the backup when the primary CT is stopped. Retries only
            # affect connect-time failures; once a gen is streaming nginx cannot
            # (and must not) re-send it.
            # Only a box that cannot answer is a failure (DP-405B). An HTTP status the engine
            # sends is that request's result: Strata answers 502 when a reply fails its JSON
            # schema. (For POSTs nginx 1.27 neither re-sent nor counted such a 502 even when it
            # was listed here -- tested locally 2026-11-04 -- but a GET would be, so the engine's
            # statuses stay off this list.) A stopped CT is error/timeout.
            proxy_next_upstream     error timeout;
            proxy_next_upstream_tries 2;

            # nginx's own errors (no CT reachable) carry X-Proxy-Error, so inference-router can
            # tell them from the engine's: error_page never applies to an upstream's response
            # while proxy_intercept_errors is off (the default).
            error_page 502 503 504 = @no_engine;
        }

        location @no_engine {
            default_type application/json;
            add_header X-Proxy-Error "r9700-proxy" always;
            return 502 '{"error": {"type": "proxy_error", "message": "r9700-proxy: no inference CT answered"}}';
        }
    }
}
